play:
  fields:
    tv:
      required: true
      example: Living Room TV
      selector:
        text:
    key:
      example: "720622"
      selector:
        text:
    title:
      example: Bill & Ted's Excellent Adventure
      selector:
        text:
    mode:
      default: play
      selector:
        select:
          options: [play, restart, next]
    activity:
      example: Movie
      selector:
        text:
    start_room:
      default: true
      selector:
        boolean:
control:
  fields:
    tv:
      required: true
      example: Living Room TV
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options: [play, pause, play_pause, stop, home, seek, skip, volume_up, volume_down, volume_set, mute, power_on, power_off]
    value:
      example: -10
      selector:
        number:
          min: -3600
          max: 86400
          mode: box
mark:
  fields:
    tv:
      required: true
      example: Living Room TV
      selector:
        text:
    key:
      required: true
      example: "720622"
      selector:
        text:
    watched:
      required: true
      selector:
        boolean:
play_trailer:
  fields:
    tv:
      required: true
      example: Living Room TV
      selector:
        text:
    key:
      example: "720622"
      selector:
        text:
    url:
      example: https://www.youtube.com/watch?v=abcdefghijk
      selector:
        text:
resume:
  fields:
    tv:
      required: true
      example: Living Room TV
      selector:
        text:
sleep_timer:
  fields:
    tv:
      required: true
      example: Theater
      selector:
        text:
    minutes:
      example: 60
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: min
    after:
      selector:
        boolean:
search:
  fields:
    query:
      required: true
      example: Ratatouille
      selector:
        text:
    tv:
      example: Theater
      selector:
        text:
    type:
      default: any
      selector:
        select:
          options:
            - any
            - movie
            - show
            - episode
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 50
